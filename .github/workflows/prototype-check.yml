name: Prototype and game check

on:
  push:
    paths: ["prototype/**", "tools/**", "game/**"]
  pull_request:
    paths: ["prototype/**", "tools/**", "game/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in prototype/browser/*.js tools/*.js; do node --check "$f"; done
      - name: Validate scenes
        run: node tools/validate_prototype.js

  godot-tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Install binary add-ons
        run: tools/install_addons.sh
      - name: Import project
        run: godot --headless --path game --import
      - name: Story tests
        run: godot --headless --path game --script res://tests/run_tests.gd
      - name: Audio tests
        run: godot --headless --path game --script res://tests/run_audio_tests.gd
      - name: UI tests
        run: godot --headless --path game --script res://tests/run_ui_tests.gd
      - name: Apartment tests
        run: godot --headless --path game --script res://tests/run_apartment_tests.gd
      - name: Player tests
        run: godot --headless --path game --script res://tests/run_player_tests.gd
