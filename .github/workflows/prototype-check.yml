name: Prototype check

on:
  push:
    paths: ["prototype/**", "tools/**"]
  pull_request:
    paths: ["prototype/**", "tools/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in prototype/browser/*.js tools/*.js; do node --check "$f"; done
      - name: Validate scenes
        run: node tools/validate_prototype.js
